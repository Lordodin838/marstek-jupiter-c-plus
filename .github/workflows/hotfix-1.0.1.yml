name: Hotfix 1.0.1 einspielen (einmalig)

on:
  push:
    paths:
      - .github/workflows/hotfix-1.0.1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch anwenden
        run: |
          echo "" | base64 -d > /tmp/hotfix.patch
          git apply /tmp/hotfix.patch
          git status --short
      - name: Tests
        run: |
          pip install voluptuous
          python tests/test_integration.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests
          git commit -m "1.0.1: Entitaeten aktualisieren sich wieder (always_update=True)"
          git push
