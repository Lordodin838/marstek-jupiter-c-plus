name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Die HACS-Pruefung holt hacs.json und manifest.json unangemeldet von
  # raw.githubusercontent.com. Bei einem privaten Repository antwortet
  # das mit 404, und HACS meldet daraufhin "invalid hacs.json" und
  # "expected a dictionary. Got None" - obwohl beide Dateien in Ordnung
  # sind; hassfest prueft manifest.json aus dem Checkout und ist
  # zufrieden. Deshalb laeuft dieser Job erst, wenn das Repository
  # oeffentlich ist. Dann greift er von selbst wieder.
  hacs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install voluptuous pyflakes
      # Findet undefinierte Namen und Tippfehler auch in Code, den die
      # Tests nicht durchlaufen (etwa async_setup_entry).
      - run: python -m pyflakes custom_components
      - run: python tests/test_integration.py
