name: Integration entpacken
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  entpacken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archiv auspacken, Reste entfernen, committen
        run: |
          set -e
          unzip -q marstek-jupiter-c-plus.zip
          rm -rf marstek-jupiter-c-plus/.github
          cp -a marstek-jupiter-c-plus/. ./
          rm -rf marstek-jupiter-c-plus
          rm -f marstek-jupiter-c-plus.zip marstek_jupiter_custom_components.zip probe-root.txt probe-nested.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integration aus dem Archiv entpackt"
          git push
