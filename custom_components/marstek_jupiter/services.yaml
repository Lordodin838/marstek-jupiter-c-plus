register_dump:
  fields:
    label:
      required: false
      default: abzug
      example: vor-update
      selector:
        text:
    sweep:
      required: false
      default: false
      selector:
        boolean:

read_register:
  fields:
    address:
      required: true
      example: 4138
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    data_type:
      required: false
      default: uint16
      selector:
        select:
          options:
            - uint16
            - int16
            - uint32
            - int32
            - string
            - raw
